<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width",initial-scale=1.0">
    <title>PROMPT: AI-HYPE ESOLANG</title>
    <style>
        :root {
            --bg: #0d0d0d;
            --text-glow: #00ffcc;
            --err-red: #ff0055;
            --grid-line: rgba(0, 255, 204, 0.08);
        }
body {
  margin: 0; padding: 0;
  background-color: var(--bg);
  color: var(--text-glow);
  font-family: 'Courier New', Courier, monospace;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  height: 100vh;
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 30px 30px; 
}


  #editor-panel {
    grid-row: 1/3; grid-column: 1 / 2;
    border-right: 2px solid var(--text-glow);
    padding: 20px;
    display: flex; flex-direction: column;
  }
    #console-panel {
    grid-row: 1 / 2; grid-column: 2 / 3;
    border-bottom: 2px solid var(--text-glow);
    padding: 20px;
    overflow-y: auto;
  }
#visual-brain {
    grid-row: 2 / 3; grid-column: 2 / 3;
    padding: 20px; overflow-y: auto;    
}

   textarea {
    flex-grow: 1;
    background: transparent;
    color: var(--text-glow);
    border: 1px solid var(--text-glow);
    outline: none;
    font-size: 16px;
    resize: none;
    padding: 10px;
   }
   button {
    background: var(--text-glow);
    color: var(--bg);
    border: none;
    padding: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
   }
button:hover { background: var(--err-red); color:white; }


.gaslight-error { color: var(--err-red); font-weight: bold; text-shadow: 0 0 5px var(--err-red); }
</style>
</head>
<body>
   <div id="editor-panel">
    <h2> CODE_INPUT</h2>
    <textarea id="code-editor">ACT_AS SupremeLeader
    TAKE_INPUT patience = 0
    OUTPUT "Initializing hallucination..."</textarea>
    <button id="run-btn">EVALUATE</button>
   </div>
 <div id="console-panel">
    <h2> TRACE_CONSOLE </h2>
    <div id="console-output"></div>
 </div>
<div id="visual-brain">
    <h2> VISUAL_BRAIN // MEMORY </h2>
    <div id="memory-map"></div>
</div>


<script type="module" src="app.js"></script>
</body>
</html>
