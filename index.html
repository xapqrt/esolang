<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width",initial-scale=1" />
    <title>PROMPT - eslong IDE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="grid-root">
    <aside class="panel left"
    <div class="toolbar">
      <button id="runBtn">Run</button>
      <button id="stepBtn">Step</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <label><input id="stepToggle" type="checkbox" /> THINK_STEP_BY_STEP</label>
         <select id="samples" aria-label="samples">
          <option value="">-- samples --</option>
          <option value="demo1">Hello & math</option>
          <option value="demo2">Conditional & assert</option>
        </select>
        <button id="clearConsoleBtn">Clear Console</button>
      </div>
       <div class="editor-wrap">
       <input id="snippetName" placeholder="snippet name" style="min-width:120px;margin-left:8px" /> 
        <button id="saveSnippet">Save Snippet</button>
        <select id="workspaceSelect"><option value="">-- workspace --</option></select>
        <button id="deleteSnippet">Delete</button>
        <textarea id="editor" spellcheck="false">ACT_AS Demo
         TAKE_INPUT x = 5
          TAKE_INPUT b = 7
         OUTPUT "hello"
        </textarea>
     <div class="gutter" id="gutter">1</div>
    <pre class="highlighter" id="highlighter"></pre>
   </div>
    </aside>

    <section class=""panel right">
      <div class="console" id="consoleOut"></div>
      <div class="visual" id="visualBrain"></div>
    </section>
  </div>

  <script type="module" src="engine.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
